# Render production deployment BLUEPRINT — paid infrastructure.
# Review costs before syncing; committing this file does not provision services.
previews:
  generation: off
services:
  - type: web
    name: opendots-runtime
    runtime: docker
    region: singapore
    plan: starter
    autoDeployTrigger: off
    dockerContext: ./apps/opendots
    dockerfilePath: ./apps/opendots/Dockerfile
    healthCheckPath: /
    disk:
      name: opendots-state
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: '4310'
      - key: DATABASE_PATH
        value: /data/opendots.sqlite
      - key: OWNER_ID
        value: opendots-owner
      - key: OWNER_TOKEN
        generateValue: true
      - key: APP_ORIGIN
        value: https://opendots-omniroute-zeta.vercel.app,https://opendots-omniroute-nullreaperexe-clouds-projects.vercel.app
      - key: OMNIROUTE_API_KEY
        value: private-internal-router
      - key: OMNIROUTE_MODEL
        value: auto
      - key: OMNIROUTE_HOSTPORT
        fromService:
          type: pserv
          name: omniroute-runtime
          property: hostport
      - key: BROWSER_HOSTPORT
        fromService:
          type: pserv
          name: opendots-browser
          property: hostport
      - key: BROWSER_SECRET
        fromService:
          type: pserv
          name: opendots-browser
          envVarKey: BROWSER_SECRET
      - key: WEB_SEARCH_PROVIDER
        value: browser
      - key: DO_NOT_TRACK
        value: '1'
  - type: pserv
    name: omniroute-runtime
    runtime: docker
    region: singapore
    plan: standard
    autoDeployTrigger: off
    dockerContext: ./apps/omniroute
    dockerfilePath: ./apps/omniroute/Dockerfile
    disk:
      name: omniroute-state
      mountPath: /app/data
      sizeGB: 2
    envVars:
      - key: HOSTNAME
        value: 0.0.0.0
      - key: PORT
        value: '20128'
      - key: DATA_DIR
        value: /app/data
      - key: REQUIRE_API_KEY
        value: 'false'
      - key: NEXT_TELEMETRY_DISABLED
        value: '1'
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: omniroute-cache
          property: connectionString
      - key: OMNIROUTE_WS_BRIDGE_SECRET
        generateValue: true
  - type: pserv
    name: opendots-browser
    runtime: docker
    region: singapore
    plan: standard
    autoDeployTrigger: off
    dockerContext: ./apps/opendots
    dockerfilePath: ./apps/opendots/Dockerfile
    dockerCommand: node dist/server/browser/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: BROWSER_HOST
        value: 0.0.0.0
      - key: BROWSER_PORT
        value: '4311'
      - key: BROWSER_SECRET
        generateValue: true
  - type: keyvalue
    name: omniroute-cache
    region: singapore
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
