name: Check FreeLLMAPI Cloud Setup
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/cloud-chat-smoke.yml']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Vercel FreeLLMAPI configuration and connected router
        shell: bash
        run: |
          set -euo pipefail
          SITE="https://opendots-omniroute.vercel.app"
          echo "Checking Vercel chat health (does not expose keys)"
          STATUS=$(curl --retry 2 --retry-delay 3 -sS --max-time 25 -o /tmp/cloud-health.json -w '%{http_code}' "$SITE/api/instant-chat")
          HEALTH_STATUS="$STATUS" python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path('/tmp/cloud-health.json').read_text())
          print('Health HTTP:', os.environ['HEALTH_STATUS'])
          print('Provider:',d.get('provider'))
          print('Configured:',d.get('configured'))
          if os.environ['HEALTH_STATUS'] != '200' or d.get('provider')!='freellmapi':
              raise SystemExit('FreeLLMAPI serverless handler is not deployed.')
          if not d.get('configured'):
              print('SETUP REQUIRED: FREELLMAPI_API_KEY and public HTTPS FREELLMAPI_BASE_URL must be set in Vercel Production.')
          PY
          echo "Checking cloud public-page navigation (without browser credentials)"
          BROWSE_CODE=$(curl -sS --max-time 30 -o /tmp/cloud-browser-health.json -w '%{http_code}' "$SITE/api/cloud-browser")
          BROWSE_STATUS="$BROWSE_CODE" python3 - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads(Path('/tmp/cloud-browser-health.json').read_text())
          print('Public webpage reader HTTP:',os.environ['BROWSE_STATUS'])
          print('Available:',data.get('available'))
          if os.environ['BROWSE_STATUS']!='200' or data.get('available') is not True:
              raise SystemExit('Cloud page reader health check failed.')
          PY
          READ_STATUS=$(curl -sS --max-time 38 -o /tmp/cloud-browser-page.json -w '%{http_code}' \
            "$SITE/api/cloud-browser" -X POST \
            -H 'Content-Type: application/json' \
            -H "Origin: $SITE" \
            --data '{"url":"https://www.example.com/"}')
          READ_HTTP="$READ_STATUS" python3 - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads(Path('/tmp/cloud-browser-page.json').read_text())
          print('Public webpage read HTTP:',os.environ['READ_HTTP'])
          print('Source:',data.get('url',''))
          print('Extracted readable text:',len(data.get('content','')))
          if os.environ['READ_HTTP']!='200' or len(data.get('content',''))<20:
              print('Reader message:',data.get('error','not available'))
              raise SystemExit('Cloud webpage reading failed.')
          PY
          READY=$(python3 - <<'PY'
          import json
          from pathlib import Path
          print('1' if json.loads(Path('/tmp/cloud-health.json').read_text()).get('configured') else '0')
          PY
          )
          if [ "$READY" != "1" ]; then
            echo "::warning::Router not connected: add FREELLMAPI_API_KEY plus reachable HTTPS FREELLMAPI_BASE_URL in Vercel Production, redeploy, then rerun smoke."
            exit 0
          fi
          echo "Checking one real FreeLLMAPI completion (router must be online)"
          CODE=$(curl -sS --max-time 65 -o /tmp/cloud-reply.json -w '%{http_code}' \
            "$SITE/api/instant-chat" -X POST \
            -H 'Content-Type: application/json' \
            -H "Origin: $SITE" \
            --data '{"messages":[{"role":"user","content":"Reply with a single word: ready"}]}')
          RESPONSE_CODE="$CODE" python3 - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads(Path('/tmp/cloud-reply.json').read_text())
          print('Completion HTTP:',os.environ['RESPONSE_CODE'])
          print('Provider:',data.get('provider','unavailable'))
          print('Model:',data.get('model','none'))
          print('Reply received:',isinstance(data.get('reply'),str) and bool(data['reply'].strip()))
          if 'error' in data:
              print('Error category:',data.get('reason','unknown'))
              print('Message:',data['error'])
          if os.environ['RESPONSE_CODE']!='200' or not data.get('reply'):
              raise SystemExit('FreeLLMAPI unified router is not configured, online, or able to respond.')
          PY
